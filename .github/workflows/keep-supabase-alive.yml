name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 8 * * *" # Runs every day at 8am UTC
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase tables to register activity
        run: |
          TABLES=("users" "captain_selections" "gameweek_results" "qualifying_games")

          for TABLE in "${TABLES[@]}"; do
            echo "Querying table: $TABLE"
            response=$(curl -s -o /dev/null -w "%{http_code}" \
              "${{ secrets.SUPABASE_URL }}/rest/v1/$TABLE?select=*&limit=1" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
            echo "$TABLE responded with status: $response"
            if [ "$response" -ge 400 ]; then
              echo "::warning::Supabase table $TABLE returned status $response"
              exit 1
            fi
          done

          echo "All tables queried successfully - Supabase project is active"
